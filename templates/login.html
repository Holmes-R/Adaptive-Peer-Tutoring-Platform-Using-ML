<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Adaptive Peer Tutoring</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff);
            animation: gradientAnimation 10s infinite alternate;
            overflow-x: hidden;
        }

        @keyframes gradientAnimation {
            0% { background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff); }
            50% { background: linear-gradient(135deg, #2575fc, #00c6ff, #6a11cb); }
            100% { background: linear-gradient(135deg, #00c6ff, #6a11cb, #2575fc); }
        }

        /* Login Section */
        .login-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-section h1 {
            font-size: 3.5rem;
            font-weight: bold;
            animation: fadeInDown 1.5s;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
        }

        .login-section form {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1.5s;
            width: 100%;
            max-width: 400px;
        }

        .login-section form label {
            font-size: 1.2rem;
            color: white;
            display: block;
            margin-bottom: 10px;
        }

        .login-section form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .login-section form input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .login-section form button {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            width: 100%;
        }

        .login-section form button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 198, 255, 0.4);
        }

        /* Animated Shapes */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-duration: 8s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 70%;
            animation-duration: 10s;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            top: 70%;
            left: 20%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <section class="login-section">
        <!-- Animated Shapes -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>

        <h1>Create Account</h1>
        <form id="signupForm" onsubmit="return false;">
            {% csrf_token %}
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        
            <label for="password">Password:</label>
            <input type="password" id="password" name="user_password" required placeholder="Enter your password">
        
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
        
            <button type="button" id="submitBtn">Create Account</button>
        </form>
        
        <script>
            document.getElementById("submitBtn").addEventListener("click", async function(event) {
                event.preventDefault(); // Stop default form submission
            
                const name = document.getElementById("name").value;
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const confirm_password = document.getElementById("confirm_password").value;
            
                if (password !== confirm_password) {
                    alert("Passwords do not match!");
                    return;
                }
            
                try {
                    const response = await fetch("/login/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
                        },
                        body: JSON.stringify({ name, email, user_password: password, confirm_password })
                    });
            
                    const data = await response.json(); // Parse the JSON response
                    if (response.ok) {
                        // Redirect to the OTP verification page using the URL from the response
                        window.location.href = data.redirect_url;
                    } else {
                        // Display error message
                        alert(data.error || "Something went wrong!");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("Something went wrong!");
                }
            });        
        </script>
</body>
</html>
