<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File - Adaptive Peer Tutoring</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff);
            animation: gradientAnimation 10s infinite alternate;
            overflow-x: hidden;
        }

        @keyframes gradientAnimation {
            0% { background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff); }
            50% { background: linear-gradient(135deg, #2575fc, #00c6ff, #6a11cb); }
            100% { background: linear-gradient(135deg, #00c6ff, #6a11cb, #2575fc); }
        }

        /* Header Navigation Bar */
        .navbar {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: white !important;
            display: flex;
            align-items: center;
        }

        .navbar-brand i {
            margin-right: 10px;
            font-size: 2rem;
            color: #00c6ff;
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: 500;
            margin: 0 10px;
            padding: 8px 15px;
            transition: 0.3s;
            position: relative;
        }

        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #00c6ff;
            transition: 0.3s;
        }

        .navbar-nav .nav-link:hover::after {
            width: 100%;
        }

        .navbar-nav .nav-link.active {
            color: #00c6ff !important;
        }

        /* Upload Section */
        .upload-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .upload-section h1 {
            font-size: 3.5rem;
            font-weight: bold;
            animation: fadeInDown 1.5s;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
        }

        .upload-section form {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1.5s;
        }

        .upload-section form label {
            font-size: 1.2rem;
            color: white;
        }

        .upload-section form input[type="file"] {
            margin: 20px 0;
            color: white;
        }

        .upload-section form button {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-section form button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 198, 255, 0.4);
        }

        /* Animated Shapes */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-duration: 8s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 70%;
            animation-duration: 10s;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            top: 70%;
            left: 20%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-book"></i> Adaptive Peer Tutoring
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="upload.html">Upload</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Upload Section -->
    <section class="upload-section">
        <!-- Animated Shapes -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>

        <h1>Upload Your File</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <label for="email">Email:</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ email }}" readonly>
        
        

            
            {{ form.as_p }}
            <button type="submit" class="btn btn-custom">Upload</button>
        </form>
        
        
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Add active class to clicked nav link
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });
        document.querySelector("form").addEventListener("submit", function(event) {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
        
            if (!email || !password) {
                event.preventDefault(); // Stop form submission
                alert("Email and Password are required!");
            }
        });
        
    </script>
</body>
</html>
