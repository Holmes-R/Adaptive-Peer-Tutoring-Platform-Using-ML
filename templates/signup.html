<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>
        async function handleSignIn(event) {
            event.preventDefault();
            const unique_id = document.getElementById("unique_id").value;
            const password = document.getElementById("password").value;

            if (!unique_id || !password) {
                alert("Please enter both Unique ID and Password.");
                return;
            }

            try {
                const response = await fetch("/signin/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
                    },
                    body: JSON.stringify({ unique_id, password })
                });

                const data = await response.json();
                if (response.ok) {
                    //alert(`Your Unique ID: ${result.student_id}`);
                    window.location.href = `/upload/?student_id=${unique_id}`;
                } else {
                    alert(data.error || "Invalid credentials. Please try again.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong! Please try again.");
            }
        }
    </script>
</head>
<body class="d-flex justify-content-center align-items-center vh-100" style="background-color: #f4f4f4;">
    <div class="card p-4" style="width: 22rem;">
        <h2 class="text-center">Sign In</h2>
        <form onsubmit="handleSignIn(event)">
            {% csrf_token %}
            <div class="mb-3">
                <label for="unique_id" class="form-label">Unique ID</label>
                <input type="text" id="unique_id" name="unique_id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
    </div>
</body>
</html>
