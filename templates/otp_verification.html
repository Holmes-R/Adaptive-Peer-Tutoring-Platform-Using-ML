<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - Adaptive Peer Tutoring</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff);
            animation: gradientAnimation 10s infinite alternate;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes gradientAnimation {
            0% { background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff); }
            50% { background: linear-gradient(135deg, #2575fc, #00c6ff, #6a11cb); }
            100% { background: linear-gradient(135deg, #00c6ff, #6a11cb, #2575fc); }
        }

        /* OTP Container */
        .otp-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 1s;
        }

        .otp-container h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: white;
        }

        .otp-container input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
        }

        .otp-container input:focus {
            border-color: #00c6ff;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
        }

        .otp-container input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Fantasy Button Design */
        .btn-verify {
            background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-verify::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: 0.5s;
            border-radius: 50%;
        }

        .btn-verify:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-verify:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 198, 255, 0.6);
        }

        .btn-verify:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        /* Animated Shapes */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            z-index: -1;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-duration: 8s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 70%;
            animation-duration: 10s;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            top: 70%;
            left: 20%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            .otp-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .otp-container h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <!-- OTP Verification Container -->
    <div class="otp-container">
        <h2>Enter OTP</h2>
        <form id="otpForm">
            {% csrf_token %}
            <input type="hidden" id="email" value="{{ email }}">
            <input type="text" id="otp" placeholder="Enter 6-digit OTP" required>
            <button type="button" class="btn-verify" onclick="submitOtp()">Verify OTP</button>
        </form>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        async function submitOtp() {
            const email = document.getElementById("email").value;
            const otp = document.getElementById("otp").value;
            const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
            const errorMessage = document.getElementById("errorMessage");

            // Clear previous error messages
            errorMessage.textContent = "";

            // Validate OTP input
            if (!otp || otp.length !== 6 || isNaN(otp)) {
                errorMessage.textContent = "Please enter a valid 6-digit OTP.";
                return;
            }

            try {
                const response = await fetch(`/verify-otp/${email}/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({ otp })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(data.message);  // Show success message
                    window.location.href = data.redirect_url;  // Redirect to student information page
                } else {
                    errorMessage.textContent = data.error || "OTP verification failed.";  // Show error message
                }
            } catch (error) {
                console.error("Error:", error);
                errorMessage.textContent = "Something went wrong. Please try again.";
            }
        }

        // Auto-submit when 6 digits are entered
        document.getElementById('otp').addEventListener('input', function() {
            if (this.value.length === 6) {
                submitOtp();
            }
        });
    </script>
</body>
</html>
