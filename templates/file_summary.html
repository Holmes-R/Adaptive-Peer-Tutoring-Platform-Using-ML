<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Summary - Adaptive Peer Tutoring</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff);
            animation: gradientAnimation 10s infinite alternate;
            overflow-x: hidden;
        }

        @keyframes gradientAnimation {
            0% { background: linear-gradient(135deg, #6a11cb, #2575fc, #00c6ff); }
            50% { background: linear-gradient(135deg, #2575fc, #00c6ff, #6a11cb); }
            100% { background: linear-gradient(135deg, #00c6ff, #6a11cb, #2575fc); }
        }

        /* Content Section */
        .content-section {
            padding: 50px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .content-section h1 {
            font-size: 3rem;
            font-weight: bold;
            animation: fadeInDown 1.5s;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
        }

        .content-section p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .content-section button {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            margin: 10px;
        }

        .content-section button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 198, 255, 0.4);
        }

        /* Animated Shapes */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-duration: 8s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 70%;
            animation-duration: 10s;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            top: 70%;
            left: 20%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Content Section -->
        <h1>Summary Details</h1>
    
        <h2>Summary:</h2>
        <p id="summary">{{ upload.summary }}</p>
        <button onclick="speakText('{% filter escapejs %}{{ upload.summary }}{% endfilter %}')">Speak Summary</button>
    
        {% if translated_summary %}
            <h3>Translated Summary:</h3>
            <p id="translated_summary">{{ translated_summary }}</p>
            <button onclick="speakText('{% filter escapejs %}{{ translated_summary }}{% endfilter %}')">Speak Translated Summary</button>
            
            <!-- Feedback form for translated summary -->
            <h3>Your Feedback on Summary:</h3>
            <form id="feedback-form-summary" method="post" action="{% url 'submit_feedback_summary' %}">
                {% csrf_token %}
                <textarea name="feedback" rows="4" cols="50" placeholder="Please provide your feedback here..."></textarea><br><br>
                <button type="submit">Submit Feedback</button>
            </form>
        {% else %}
            <form method="post">
                {% csrf_token %}
                <button type="submit" name="action" value="translate">Translate</button>
                <select name="target_lang">
                    {% for code, name in languages %}
                        <option value="{{ code }}">{{ name }}</option>
                    {% endfor %}
                </select>
            </form>
        {% endif %}
    
        <button onclick="generatePDF()">Download PDF</button>
    
        <script>
            function speakText(text) {
                console.log("Speaking text:", text); 
                const speech = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(speech);
            }
    
            function generatePDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
    
                const originalSummary = document.getElementById("summary").innerText;
                const translatedSummary = document.getElementById("translated_summary") ? document.getElementById("translated_summary").innerText : "No translation available.";
    
                // Adding content to PDF
                doc.text("Original Summary: " + originalSummary, 10, 10);
                doc.text("Translated Summary: " + translatedSummary, 10, 20);
    
                // Save the PDF
                doc.save("Feedback_Summary.pdf");
            }
        </script>
</body>
</html>
